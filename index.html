<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio | Creative Developer</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>

<body>
  <div class="bg-motion bg-home"></div>

  <!-- Header -->
  <header class="new-header">
    <nav class="new-nav">
      <!-- Menu Button -->
      <div class="menu-container">
        <button id="menu-toggle" type="button" class="menu-btn" aria-label="Open menu">
          <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="12" y2="12"></line>
            <line x1="4" x2="20" y1="6" y2="6"></line>
            <line x1="4" x2="20" y1="18" y2="18"></line>
          </svg>
          <svg class="close-icon hidden" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>

        <div id="dropdown-menu" class="dropdown-menu hidden">
          <a href="index.html" class="menu-item">HOME</a>
          <a href="about.html" class="menu-item">ABOUT</a>
          <a href="projects.html" class="menu-item">PROJECTS</a>
          <a href="contact.html" class="menu-item">CONTACT</a>
        </div>
      </div>

      <!-- Signature -->
      <div class="signature">A</div>

      <!-- Theme Toggle -->
      <button id="theme-toggle-new" type="button" class="new-theme-toggle" aria-label="Toggle theme">
        <div class="theme-toggle-knob"></div>
      </button>
    </nav>
  </header>

  <main class="new-main">
    <!-- Centered Main Name -->
    <div class="hero-center">
      <div class="hero-name-container">
        <div class="blur-text-wrapper name-text" data-text="KUTI" data-animate-by="letters" data-direction="top"></div>
        <div class="blur-text-wrapper name-text" data-text="JOSH" data-animate-by="letters" data-direction="top"></div>

        <!-- Profile Picture -->
        <div class="hero-profile-picture">
          <div class="profile-img-container">
            <img src="/profile.jpg" alt="Profile" class="profile-img-new" />
          </div>
        </div>
      </div>
    </div>

    <!-- Tagline -->
    <div class="tagline-container">
      <div class="blur-text-wrapper tagline-text" data-text="Designing human experiences in code." data-animate-by="words" data-direction="top"></div>
    </div>

    <!-- Scroll Indicator -->
    <button type="button" class="scroll-indicator" aria-label="Scroll down">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9 6 6 6-6"></path>
      </svg>
    </button>
  </main>

  <script type="module" src="/src/main.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</body>

</html>
